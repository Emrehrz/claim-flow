services:
  postgres:
    image: postgres:16-alpine
    container_name: claimflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-claimflow}
      POSTGRES_USER: ${POSTGRES_USER:-claimflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimflow123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - claimflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimflow} -d ${POSTGRES_DB:-claimflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  claimflow-postgres-data: